# Aether CI — 每次 Push / PR 自动执行 typecheck / lint / unit test / build / security scan
# 目标（P2-08）：禁止"代码写完 → 直接 Release"；Source → CI → Fail 门禁
name: CI

on:
  push:
    branches: [master, main, 'refactor/**']
  pull_request:
    branches: [master, main]

jobs:
  quality-gate:
    name: Quality Gate (typecheck / lint / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        # 整改计划第 11 章（P0/P1）：干净 runner 用 --ignore-scripts（禁用依赖安装脚本，
        # 防止供应链攻击在 CI 执行任意代码）；lockfile 校验由 npm ci 隐式完成
        # （lockfile 与 package.json 不同步会直接失败）
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile consistency
        # 整改计划第 11 章：lockfile 与 package.json 显式校验（workspaces 必须含全部 4 个子包）
        run: |
          node -e "
            const lock = require('./package-lock.json');
            const pkg = require('./package.json');
            const lockWs = (lock.packages[''] && lock.packages[''].workspaces) || [];
            const pkgWs = pkg.workspaces || [];
            const missing = pkgWs.filter(w => !lockWs.includes(w));
            const verOk = lock.packages[''].version === pkg.version;
            if (missing.length > 0) { console.error('lockfile missing workspaces:', missing); process.exit(1); }
            if (!verOk) { console.error('lockfile version mismatch:', lock.packages[''].version, 'vs', pkg.version); process.exit(1); }
            console.log('LOCKFILE OK: workspaces=' + lockWs.join(',') + ' version=' + pkg.version);
          "

      - name: Build shared
        run: npm run build -w src/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (shared + backend + frontend)
        run: npm test

      - name: Production build
        run: npm run build

  security-scan:
    name: Security Scan (secrets + sensitive patterns + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps (for audit)
        run: npm ci --ignore-scripts --no-audit --no-fund

      # 整改计划第 11 章（P0/P1）：安全关 —— npm audit 阻断已知高危依赖
      - name: npm audit (high/critical blocker)
        run: npm audit --audit-level=high || (echo "NPM AUDIT FAILED — 存在高危/严重漏洞"; exit 1)

      - name: Scan for secrets / service-role keys / private artifacts
        run: |
          echo "== service_role / serviceRole in source =="
          if grep -rniE "service_role|serviceRole" --include="*.ts" --include="*.tsx" --include="*.js" src/ ; then
            echo "FOUND service_role in source — forbidden"; exit 1
          fi
          echo "== private artifacts in repo (jks / keystore / pacc.db) =="
          if find . -path ./node_modules -prune -o \( -name "*.jks" -o -name "keystore.properties" -o -name "pacc.db" \) -print | grep -q .; then
            echo "FOUND private artifacts — forbidden"; exit 1
          fi
          echo "== API key hardcoded in source =="
          if grep -rniE "sk-[a-zA-Z0-9]{20,}|api[_-]?key[\"']?\s*[:=]\s*[\"'][A-Za-z0-9_\-]{24,}[\"']" --include="*.ts" --include="*.tsx" src/ | grep -v "\.test\." | grep -v "test.ts"; then
            echo "FOUND hardcoded key pattern — review required"
            exit 1
          fi
          echo "SECURITY SCAN PASS"
